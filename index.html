<script>
async function initStudentLoginState() {

  const result = await db.auth.getSession();
  const session = result.data.session;

  if (session && session.user) {

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("studentProfile").style.display = "block";

    const user = session.user;

    document.getElementById("studentEmail").innerText =
      user.email || "";

    const profileResult = await db
      .from("profiles")
      .select("full_name,email")
      .eq("id", user.id)
      .maybeSingle();

    const profile = profileResult.data;

    document.getElementById("studentName").innerText =
      (profile && profile.full_name)
      ? profile.full_name
      : (user.user_metadata?.full_name || "Student");

  } else {

    document.getElementById("loginBox").style.display = "block";
    document.getElementById("studentProfile").style.display = "none";

  }
}

async function studentLogout() {
  await db.auth.signOut();
  location.reload();
}

/* =====================================
   STATE
===================================== */

function stateChanged(){

const state=
document.getElementById("state").value;

const boardBox=
document.getElementById("boardBox");

const board=
document.getElementById("board");

const classBox=
document.getElementById("classBox");

const classSelect=
document.getElementById("class");


board.innerHTML=
'<option value="">Select Board</option>';

classSelect.innerHTML=
'<option value="">Select Class</option>';

document.getElementById("subjectsBox")
.classList.add("hidden");

document.getElementById("nextBox")
.classList.add("hidden");


if(!state){

boardBox.classList.add("hidden");

classBox.classList.add("hidden");

return;

}


const data=
educationData[state];


data.boards.forEach(function(item){

const option=
document.createElement("option");

option.value=item;

option.textContent=item;

board.appendChild(option);

});


boardBox.classList.remove("hidden");


localStorage.setItem(
"selectedState",
state
);

}



/* =====================================
   BOARD
===================================== */

function boardChanged(){

const state=
document.getElementById("state").value;

const board=
document.getElementById("board").value;

const classBox=
document.getElementById("classBox");

const classSelect=
document.getElementById("class");


classSelect.innerHTML=
'<option value="">Select Class</option>';


if(!board){

classBox.classList.add("hidden");

return;

}


educationData[state].classes.forEach(function(item){

const option=
document.createElement("option");

option.value=item;

option.textContent=item;

classSelect.appendChild(option);

});


classBox.classList.remove("hidden");


localStorage.setItem(
"selectedBoard",
board
);

}



/* =====================================
   CLASS
===================================== */

function classChanged(){

const state=
document.getElementById("state").value;

const board=
document.getElementById("board").value;

const selectedClass=
document.getElementById("class").value;

const subjectsBox=
document.getElementById("subjectsBox");

const subjects=
document.getElementById("subjects");

const nextBox=
document.getElementById("nextBox");

const selectedInfo=
document.getElementById("selectedInfo");


subjects.innerHTML="";


if(!selectedClass){

subjectsBox.classList.add("hidden");

nextBox.classList.add("hidden");

return;

}


let subjectList=[];


if(selectedClass==="10th"){

subjectList=
educationData[state].subjects10;

}

else if(selectedClass==="12th"){

subjectList=
educationData[state].subjects12;

}


subjectList.forEach(function(subject){

const div=
document.createElement("div");

div.className="subject";


div.innerHTML=`

<span class="subject-icon">
${getSubjectIcon(subject)}
</span>

${subject}

`;


div.onclick=function(){

selectSubject(subject);

};


subjects.appendChild(div);

});


selectedInfo.innerHTML=

"<b>Selected:</b><br>"+

"🇮🇳 State: "+
stateName(state)+
"<br>"+

"🏫 Board: "+
board+
"<br>"+

"🎓 Class: "+
selectedClass;


subjectsBox.classList.remove("hidden");

nextBox.classList.remove("hidden");


localStorage.setItem(
"selectedClass",
selectedClass
);

}

/* =====================================
   SUBJECT ICON
===================================== */

function getSubjectIcon(subject){

if(subject.includes("Math"))
return "🔢";


if(
subject.includes("Science") ||
subject.includes("Physics") ||
subject.includes("Chemistry") ||
subject.includes("Biology")
)
return "🔬";


if(subject.includes("History"))
return "🏛️";


if(subject.includes("Geography"))
return "🌍";


if(subject.includes("English"))
return "🇬🇧";


if(subject.includes("Hindi"))
return "🇮🇳";


if(subject.includes("Marathi"))
return "🟠";


if(subject.includes("Gujarati"))
return "🟡";


return "📚";

}

let selectedCompetitiveExam="";

let selectedCompetitiveLevel="";



/* =====================================
   COMPETITIVE EXAM CHANGE
===================================== */

function competitiveExamChanged(){

selectedCompetitiveExam=
document.getElementById(
"competitiveExam"
).value;


const levelBox=
document.getElementById(
"competitiveLevelBox"
);

const level=
document.getElementById(
"competitiveLevel"
);

const info=
document.getElementById(
"competitiveInfo"
);

const button=
document.getElementById(
"competitiveButton"
);


level.innerHTML=
'<option value="">Select Exam / Level</option>';

info.classList.add("hidden");

button.classList.add("hidden");


if(!selectedCompetitiveExam){

levelBox.classList.add("hidden");

return;

}


const data=
competitiveData[
selectedCompetitiveExam
];


data.levels.forEach(function(item){

const option=
document.createElement("option");

option.value=item;

option.textContent=item;

level.appendChild(option);

});


levelBox.classList.remove("hidden");


localStorage.setItem(
"competitiveExam",
selectedCompetitiveExam
);

}



/* =====================================
   COMPETITIVE LEVEL
===================================== */

function competitiveLevelChanged(){

selectedCompetitiveLevel=
document.getElementById(
"competitiveLevel"
).value;


const info=
document.getElementById(
"competitiveInfo"
);

const button=
document.getElementById(
"competitiveButton"
);


if(!selectedCompetitiveLevel){

info.classList.add("hidden");

button.classList.add("hidden");

return;

}


const data=
competitiveData[
selectedCompetitiveExam
];


info.innerHTML=

"<b>Selected:</b><br>"+

"🎯 Exam: "+
data.name+
"<br>"+

"📋 Level: "+
selectedCompetitiveLevel+
"<br>"+

"📚 Subjects: "+
data.subjects.join(", ");


info.classList.remove("hidden");

button.classList.remove("hidden");


localStorage.setItem(
"competitiveLevel",
selectedCompetitiveLevel
);

}

async function loadStudentProfile() {

  const { data: { user } } = await db.auth.getUser();

  const profileBox = document.getElementById("studentProfile");
  const nameBox = document.getElementById("studentName");
  const emailBox = document.getElementById("studentEmail");

  if (!user) {
    profileBox.style.display = "block";
    nameBox.innerText = "Login Required";
    emailBox.innerText = "";
    return;
  }

  const { data: profile, error } = await db
    .from("profiles")
    .select("full_name,email")
    .eq("id", user.id)
    .single();

  profileBox.style.display = "block";

  if (error) {
    nameBox.innerText =
      user.user_metadata?.full_name || "Student";
    emailBox.innerText = user.email || "";
    return;
  }

  nameBox.innerText =
    profile.full_name ||
    user.user_metadata?.full_name ||
    "Student";

  emailBox.innerText =
    profile.email ||
    user.email ||
    "";
}


async function studentLogout() {

  const { error } = await db.auth.signOut();

  if (error) {
    alert("Logout failed: " + error.message);
    return;
  }

  window.location.href = "login.html";
}
