function competitiveExamChanged(){

  const exam =
    document.getElementById("competitiveExam").value;

  const levelBox =
    document.getElementById("competitiveLevelBox");

  const level =
    document.getElementById("competitiveLevel");

  const info =
    document.getElementById("competitiveInfo");


  level.innerHTML =
    '<option value="">Select Exam / Recruitment</option>';

  info.classList.add("hidden");


  if(!exam){

    levelBox.classList.add("hidden");

    return;
  }


  competitiveData[exam].exams.forEach(function(item){

    const option =
      document.createElement("option");

    option.value = item;
    option.textContent = item;

    level.appendChild(option);

  });


  levelBox.classList.remove("hidden");

}


/* =========================================
   COMPETITIVE LEVEL CHANGE
========================================= */

function competitiveLevelChanged(){

  const exam =
    document.getElementById("competitiveExam").value;

  const level =
    document.getElementById("competitiveLevel").value;

  const info =
    document.getElementById("competitiveInfo");


  if(!level){

    info.classList.add("hidden");

    return;
  }


  info.innerHTML =

    "<b>Selected:</b><br>" +

    "🎯 Exam: " +
    competitiveData[exam].name +

    "<br>📋 Recruitment: " +
    level +

    "<br><br>📚 Next: Subject → Topic → MCQ";


  info.classList.remove("hidden");

  localStorage.setItem(
    "competitiveExam",
    exam
  );

  localStorage.setItem(
    "competitiveLevel",
    level
  );

}

/* =========================================
   STATE CHANGE
========================================= */

function stateChanged(){

const state =
document.getElementById("state").value;

const boardBox =
document.getElementById("boardBox");

const board =
document.getElementById("board");

const classBox =
document.getElementById("classBox");

const classSelect =
document.getElementById("class");

const subjectsBox =
document.getElementById("subjectsBox");

const nextBox =
document.getElementById("nextBox");


board.innerHTML =
'<option value="">Select Board</option>';

classSelect.innerHTML =
'<option value="">Select Class</option>';

subjectsBox.classList.add("hidden");
nextBox.classList.add("hidden");


if(!state){

boardBox.classList.add("hidden");
classBox.classList.add("hidden");

return;

}


const data =
educationData[state];


data.boards.forEach(function(item){

const option =
document.createElement("option");

option.value=item;
option.textContent=item;

board.appendChild(option);

});


boardBox.classList.remove("hidden");

localStorage.setItem(
"selectedState",
state
);

}


/* =========================================
   BOARD CHANGE
========================================= */

function boardChanged(){

const state =
document.getElementById("state").value;

const board =
document.getElementById("board").value;

const classBox =
document.getElementById("classBox");

const classSelect =
document.getElementById("class");

classSelect.innerHTML =
'<option value="">Select Class</option>';

if(!board){

classBox.classList.add("hidden");

return;

}


educationData[state].classes.forEach(function(item){

const option =
document.createElement("option");

option.value=item;
option.textContent=item;

classSelect.appendChild(option);

});


classBox.classList.remove("hidden");

localStorage.setItem(
"selectedBoard",
board
);

}


/* =========================================
   CLASS CHANGE
========================================= */

function classChanged(){

const state =
document.getElementById("state").value;

const board =
document.getElementById("board").value;

const selectedClass =
document.getElementById("class").value;

const subjectsBox =
document.getElementById("subjectsBox");

const subjects =
document.getElementById("subjects");

const nextBox =
document.getElementById("nextBox");

const selectedInfo =
document.getElementById("selectedInfo");


subjects.innerHTML="";


if(!selectedClass){

subjectsBox.classList.add("hidden");
nextBox.classList.add("hidden");

return;

}


let subjectList=[];


if(selectedClass==="10th"){

subjectList =
educationData[state].subjects10;

}

else if(selectedClass==="12th"){

subjectList =
educationData[state].subjects12;

}


subjectList.forEach(function(subject,index){

const div =
document.createElement("div");

div.className="subject";

div.innerHTML=`

<span class="subject-icon">
${getSubjectIcon(subject)}
</span>

${subject}

`;

div.onclick=function(){

selectSubject(subject);

};

subjects.appendChild(div);

});


selectedInfo.innerHTML =

"<b>Selected:</b><br>" +

"🇮🇳 State: " + stateName(state) + "<br>" +

"🏫 Board: " + board + "<br>" +

"🎓 Class: " + selectedClass;


subjectsBox.classList.remove("hidden");

nextBox.classList.remove("hidden");


localStorage.setItem(
"selectedClass",
selectedClass
);

}

selectedSubject=subject;

localStorage.setItem(
"selectedSubject",

);


const info =
document.getElementById("selectedInfo");

info.innerHTML +=

"<br>📚 Subject: <b>" +
subject +
"</b>";

}


/* =========================================
   SUBJECT ICON
========================================= */

function getSubjectIcon(subject){

if(subject.includes("Math")){
return "🔢";
}

if(
subject.includes("Science") ||
subject.includes("Physics") ||
subject.includes("Chemistry") ||
subject.includes("Biology")
){
return "🔬";
}

if(
subject.includes("History")
){
return "🏛️";
}

if(
subject.includes("Geography")
){
return "🌍";
}

if(
subject.includes("English")
){
return "🇬🇧";
}

if(
subject.includes("Hindi")
){
return "🇮🇳";
}

if(
subject.includes("Marathi")
){
return "🟠";
}

if(
subject.includes("Gujarati")
){
return "🟡";
}

return "📚";

}


/* =========================================
   STATE NAME
========================================= */

function stateName(state){

const names={

maharashtra:"Maharashtra",
madhya_pradesh:"Madhya Pradesh",
uttar_pradesh:"Uttar Pradesh",
rajasthan:"Rajasthan",
gujarat:"Gujarat",
bihar:"Bihar",
west_bengal:"West Bengal",
tamil_nadu:"Tamil Nadu",
karnataka:"Karnataka",
telangana:"Telangana",
andhra_pradesh:"Andhra Pradesh",
punjab:"Punjab",
delhi:"Delhi"

};

return names[state] || state;

}


/* =========================================
   CONTINUE
========================================= */

document.getElementById("state").value;

document.getElementById("board").value;

const selectedClass =
document.getElementById("class").value;

alert(
"Please select a Subject first."
);

return;

}


alert(

"Next Step Ready!\n\n" +

"State: " + stateName(state) + "\n" +

"Board: " + board + "\n" +

"Class: " + selectedClass + "\n" +

"Subject: " + selectedSubject + "\n\n" +

"अब Chapter → Topic → MCQ बनाया जाएगा।"

);

}


/* =========================================
   LOAD SAVED LANGUAGE
========================================= */

const appLang =
localStorage.getItem("appLanguage") || "hi";

const questionLang =
localStorage.getItem("questionLanguage") || "hi";

document.getElementById("appLanguage").value =
appLang;

document.getElementById("questionLanguage").value =
questionLang;

document.getElementById("tagline").innerText =
translations[appLang].tagline;

}
