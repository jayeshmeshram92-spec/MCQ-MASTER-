<!DOCTYPE html>

.profile{

}

label{

button.mainBtn{

  font-size:16px;

}

.green{

}

.examBox{
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  background:#0b2044;
  border:1px solid #315f9f;
}

  padding:15px;

}

footer{
  text-align:center;
  padding:25px;
  color:#7595bd;
}

</style>

</head>


<body>

<!-- =====================================

<div class="header">

<!-- =====================================

<label>

<select id="questionLanguage"
onchange="saveSettings()">

<option>Chhattisgarh</option>
<option>Uttarakhand</option>
<option>Himachal Pradesh</option>
<option>Goa</option>

<option value="">

</option>

</select>

<select id="topic">

<option>

</option>

<option>

</option>

</option>

</option>

onclick="startEducationMCQ()">

     COMPETITIVE EXAMS
===================================== -->

<div class="card">

<h2>🏆 Competitive Exams</h2>

<label>Exam Category</label>

<select id="examCategory"
onchange="loadCompetitiveExams()">

<option value="">
Select Category
</option>

<option>Army</option>
<option>Railway</option>
<option>Police</option>
<option>Forest</option>
<option>SSC / Government</option>
<option>Banking</option>
<option>ITI</option>

</select>


<label>Exam / Recruitment</label>

<select id="competitiveExam">

<option value="">
Select Exam
</option>

</select>


<label>Subject</label>

<select id="competitiveSubject">

<option>General Knowledge</option>
<option>General Science</option>
<option>Mathematics</option>

<option>English</option>

</select>

<select id="competitiveTopic">

<option>All Topics</option>
<option>Practice Set 1</option>
<option>Practice Set 2</option>

onclick="startCompetitiveMCQ()">

🏆 Start Competitive MCQ

  Loading student profile...
</div>

</div>


<footer>

© 2026 MCQ MASTER<br>
Education • Practice • Competitive Exams

</footer>


<script>

// =====================================
// SUPABASE
// =====================================

const SUPABASE_URL =
"https://sssuikjzkurnwntthflx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pmLD97XYDiVBTxu5Ouedtw_r4uL4is9";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// =====================================
// GLOBAL USER
// =====================================

let currentUser = null;


// =====================================
// CHECK LOGIN
// =====================================

async function checkStudentLogin(){

  const { data, error } =
    await db.auth.getSession();


  if(error || !data.session){

    window.location.replace("login.html");

    return;
  }


  currentUser =
    data.session.user;


  await loadStudentProfile();

}


// =====================================
// LOAD PROFILE
// =====================================

async function loadStudentProfile(){

  const nameElement =
    document.getElementById("studentName");

  const emailElement =
    document.getElementById("studentEmail");

  const status =
    document.getElementById("status");


  emailElement.innerText =
    currentUser.email || "";


  const { data: profile } =
    await db
      .from("profiles")
      .select(`
        full_name,
        email,
        app_language,
        question_language,
        state,
        board,
        class_name
      `)
      .eq("id", currentUser.id)
      .maybeSingle();


  if(profile){

    nameElement.innerText =
      profile.full_name ||
      currentUser.user_metadata?.full_name ||
      "Student";


    if(profile.app_language){

      document.getElementById("appLanguage").value =
        profile.app_language;

    }


    if(profile.question_language){

      document.getElementById("questionLanguage").value =
        profile.question_language;

    }


    if(profile.state){

      document.getElementById("state").value =
        profile.state;

      loadBoards(profile.board, profile.class_name);

    }

  }else{

    nameElement.innerText =
      currentUser.user_metadata?.full_name ||
      "Student";

  }


  status.innerText =
    "✅ Student account active";

}


// =====================================
// SAVE SETTINGS
// =====================================

async function saveSettings(){

  if(!currentUser) return;


  const appLanguage =
    document.getElementById("appLanguage").value;


  const questionLanguage =
    document.getElementById("questionLanguage").value;


  await db
    .from("profiles")
    .update({

      app_language:appLanguage,

      question_language:questionLanguage

    })
    .eq("id",currentUser.id);

}


// =====================================
// LOAD BOARDS
// =====================================

function loadBoards(savedBoard="", savedClass=""){

  const state =
    document.getElementById("state").value;

  const board =
    document.getElementById("board");


  board.innerHTML =
    '<option value="">Select Board</option>';


  if(!state) return;


  if(state === "Maharashtra"){

    board.innerHTML +=
      '<option>MSBSHSE</option>';

    board.innerHTML +=
      '<option>CBSE</option>';

    board.innerHTML +=
      '<option>ICSE</option>';

  }else{

    board.innerHTML +=
      '<option>State Board</option>';

    board.innerHTML +=
      '<option>CBSE</option>';

    board.innerHTML +=
      '<option>ICSE</option>';

  }


  if(savedBoard){

    board.value = savedBoard;

  }


  loadClasses(savedClass);

}


// =====================================
// LOAD CLASSES
// =====================================

function loadClasses(savedClass=""){

  const classSelect =
    document.getElementById("className");


  classSelect.innerHTML =
    '<option value="">Select Class</option>';


  for(let i=1;i<=12;i++){

    classSelect.innerHTML +=
      '<option>Class ' + i + '</option>';

  }


  classSelect.innerHTML +=
    '<option>ITI</option>';


  if(savedClass){

    classSelect.value = savedClass;

    loadSubjects();

  }

}


// =====================================
// LOAD SUBJECTS
// =====================================

function loadSubjects(){

  const className =
    document.getElementById("className").value;

  const subject =
    document.getElementById("subject");


  subject.innerHTML =
    '<option value="">Select Subject</option>';


  const subjects = [

    "Mathematics",
    "Science",
    "Physics",
    "Chemistry",
    "Biology",
    "Marathi",
    "Hindi",
    "English",
    "History",
    "Geography",
    "Civics",
    "Economics",
    "Computer Science"

  ];


  subjects.forEach(function(item){

    subject.innerHTML +=
      "<option>" + item + "</option>";

  });

}


// =====================================
// START EDUCATION MCQ
// =====================================

async function startEducationMCQ(){

  const state =
    document.getElementById("state").value;

  const board =
    document.getElementById("board").value;

  const className =
    document.getElementById("className").value;

  const subject =
    document.getElementById("subject").value;


  if(!state ||
     !board ||
     !className ||
     !subject){

    alert(
      "State, Board, Class aur Subject select karo."
    );

    return;
  }


  if(currentUser){

    await db
      .from("profiles")
      .update({

        state:state,

        board:board,

        class_name:className

      })
      .eq("id",currentUser.id);

  }


  alert(
    "MCQ section next step me connect hoga.\n\n" +
    state + " → " +
    board + " → " +
    className + " → " +
    subject
  );

}


// =====================================
// COMPETITIVE EXAMS
// =====================================

const competitiveData = {

  "Army":[
    "Agniveer",
    "GD",
    "Technical",
    "Clerk"
  ],

  "Railway":[
    "RRB Group D",
    "RRB NTPC",
    "ALP",
    "Technician"
  ],

  "Police":[
    "Police Constable",
    "Police Bharti",
    "SI"
  ],

  "Forest":[
    "Forest Guard",
    "Forest Ranger"
  ],

  "SSC / Government":[
    "SSC GD",
    "SSC CHSL",
    "SSC CGL",
    "MPSC",
    "UPSC"
  ],

  "Banking":[
    "IBPS Clerk",
    "IBPS PO",
    "SBI Clerk",
    "SBI PO"
  ],

  "ITI":[
    "Electrician",
    "Fitter",
    "Welder",
    "COPA"
  ]

};


// =====================================
// LOAD COMPETITIVE EXAMS
// =====================================

function loadCompetitiveExams(){

  const category =
    document.getElementById("examCategory").value;

  const exam =
    document.getElementById("competitiveExam");


  exam.innerHTML =
    '<option value="">Select Exam</option>';


  if(!category) return;


  competitiveData[category]
    .forEach(function(item){

      exam.innerHTML +=
        "<option>" +
        item +
        "</option>";

    });

}


// =====================================
// START COMPETITIVE MCQ
// =====================================

function startCompetitiveMCQ(){

  const category =
    document.getElementById("examCategory").value;

  const exam =
    document.getElementById("competitiveExam").value;

  const subject =
    document.getElementById("competitiveSubject").value;


  if(!category || !exam){

    alert(
      "Exam Category aur Exam select karo."
    );

    return;
  }


  alert(
    "Competitive MCQ section next step me connect hoga.\n\n" +
    category + " → " +
    exam + " → " +
    subject
  );

}


// =====================================
// LOGOUT
// =====================================

async function studentLogout(){

  await db.auth.signOut();

  window.location.replace("login.html");

}


// =====================================
// AUTH STATE
// =====================================

db.auth.onAuthStateChange(
  function(event, session){

    if(!session){

      window.location.replace("login.html");

    }

  }
);


// =====================================
// START
// =====================================

checkStudentLogin();

</script>


</body>
</html>
