<!DOCTYPE html>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;

}

header{
  background:#102d64;

}

header h1{

}

.container{

}

.card{

  border:2px solid #2677ff;

}

h2{

}

label{
  display:block;
  margin-top:15px;

  font-size:18px;

}

input,select,textarea{

  border:0;

}

.primary{

.green{

}

.red{
  background:#e52b2b;

}

.gray{

}

.option{

  color:#111;
  text-align:left;

}

.option.selected{

}

.hidden{

}

.small{

}

.score{

}

.question{

}

.correct{

  color:#073b16!important;
}

.wrong{
  background:#ffc0c0!important;
  color:#650000!important;
}

.topbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.topbar button{
  width:auto;
  flex:1;
}

hr{
  border:0;
  border-top:1px solid #4672ad;
  margin:25px 0;
}

.review-item{
  background:#092149;
  padding:15px;
  border-radius:15px;
  margin-top:12px;
}

#loading{
  text-align:center;
  font-size:20px;
  padding:30px;
}
</style>
</head>

<!-- TEST -->

<script>

const SUPABASE_URL =
"https://sssuikjzkurnwntthflx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pmLD97XYDiVBTxu5Ouedtw_r4uL4is9";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentQuestions = [];
let currentAnswers = [];
let currentQuestionIndex = 0;
let testInfo = {};
let lastResult = null;


/* ---------------- AUTH ---------------- */

async function checkSession(){

  const {data:{session}} =
    await db.auth.getSession();

  if(session){

    currentUser = session.user;

    document.getElementById("loginSection")
      .classList.add("hidden");

    document.getElementById("profileSection")
      .classList.remove("hidden");

    document.getElementById("profileEmail")
      .innerText = currentUser.email;

    await loadProfile();

  }else{

    document.getElementById("loginSection")
      .classList.remove("hidden");

  }
}


async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    document.getElementById("loginMessage")
      .innerText = "Email aur password bharo.";

    return;
  }

  const {data,error} =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    document.getElementById("loginMessage")
      .innerText = error.message;

    return;
  }

  currentUser = data.user;

  document.getElementById("loginSection")
    .classList.add("hidden");

  document.getElementById("profileSection")
    .classList.remove("hidden");

  document.getElementById("profileEmail")
    .innerText = currentUser.email;

  await loadProfile();
}


async function signup(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    document.getElementById("loginMessage")
      .innerText = "Email aur password bharo.";

    return;
  }

  if(password.length < 6){

    document.getElementById("loginMessage")
      .innerText =
      "Password kam se kam 6 characters ka hona chahiye.";

    return;
  }

  const {error} =
    await db.auth.signUp({
      email,
      password
    });

  if(error){

    document.getElementById("loginMessage")
      .innerText = error.message;

    return;
  }

  document.getElementById("loginMessage")
    .innerText =
    "Account create ho gaya. Agar email confirmation maange to email verify karo.";
}


async function logout(){

  await db.auth.signOut();

  location.reload();
}


/* ---------------- PROFILE ---------------- */

async function loadProfile(){

  if(!currentUser) return;

  const {data,error} =
    await db
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){

    console.log(error);
    return;
  }

  if(data){

    document.getElementById("fullName").value =
      data.full_name || "";

    document.getElementById("appLanguage").value =
      data.app_language || "English";

    document.getElementById("questionLanguage").value =
      data.question_language || "English";
  }
}


async function saveProfile(){

  if(!currentUser) return;

  const profile = {

    id: currentUser.id,

    email: currentUser.email,

    full_name:
      document.getElementById("fullName").value.trim(),

    app_language:
      document.getElementById("appLanguage").value,

    question_language:
      document.getElementById("questionLanguage").value
  };

  const {error} =
    await db
      .from("profiles")
      .upsert(profile);

  if(error){

    document.getElementById("profileMessage")
      .innerText = error.message;

    return;
  }

  document.getElementById("profileMessage")
    .innerText =
    "Profile saved successfully.";
}


function openMain(){

  document.getElementById("profileSection")
    .classList.add("hidden");

  document.getElementById("mainSection")
    .classList.remove("hidden");

  document.getElementById("mainAppLanguage").value =
    document.getElementById("appLanguage").value;

  document.getElementById("mainQuestionLanguage").value =
    document.getElementById("questionLanguage").value;

  loadHistory();
}


/* ---------------- EDUCATION MCQ ---------------- */

async function startEducationMCQ(){

  const state =
    document.getElementById("state").value;

  const board =
    document.getElementById("board").value;

  const className =
    document.getElementById("className").value;

  const subject =
    document.getElementById("subject").value;

  const topic =
    document.getElementById("topic").value;

  const language =
    document.getElementById("mainQuestionLanguage").value;

  if(!state || !board || !className || !subject){

    alert(
      "State, Board, Class aur Subject select karo."
    );

    return;
  }


  /*
    IMPORTANT FIX:

    App mein "Class 10" hai.
    Database mein agar "10" save hai,
    dono values check hongi.
  */

  const possibleClassValues = [
    className,
    className.replace(/^Class\s+/i,"")
  ];


  showLoading(true);


  let query =
    db
      .from("questions")
      .select("*")
      .eq("question_type","education")
      .eq("state",state)
      .eq("board",board)
      .in("class_name",possibleClassValues)
      .eq("subject",subject)
      .eq("language",language);


  if(topic && topic !== "All Chapters / Topics"){

    query =
      query.eq("chapter",topic);
  }


  const {data,error} = await query;


  showLoading(false);


  if(error){

    console.error(error);

    alert(
      "Questions load nahi ho paaye.\n\n" +
      error.message
    );

    return;
  }


  if(!data || data.length === 0){

    alert(
      "Is selection ke liye abhi koi MCQ available nahi hai.\n\n" +
      "Admin Panel mein State, Board, Class, Subject, Chapter aur Language check karo."
    );

    return;
  }


  const questions =
    data.map(q => ({

      question:q.question,

      options:[
        q.option_a,
        q.option_b,
        q.option_c,
        q.option_d
      ],

      correct:
        ["A","B","C","D"]
          .indexOf(q.correct_answer),

      explanation:
        q.explanation || ""
    }));


  openTest(

    questions,

    {
      type:"Education",
      state,
      board,
      className,
      subject,
      topic,
      language
    }

  );
}


/* ---------------- COMPETITIVE ---------------- */

async function startCompetitiveMCQ(){

  const category =
    document.getElementById("examCategory").value;

  const exam =
    document.getElementById("examName").value;

  const language =
    document.getElementById("mainQuestionLanguage").value;


  if(!category || !exam){

    alert(
      "Competitive Category aur Exam select karo."
    );

    return;
  }


  showLoading(true);


  const {data,error} =
    await db
      .from("questions")
      .select("*")
      .eq("question_type","competitive")
      .eq("exam_category",category)
      .eq("exam_name",exam)
      .eq("language",language);


  showLoading(false);


  if(error){

    alert(
      "Questions load nahi ho paaye.\n\n" +
      error.message
    );

    return;
  }


  if(!data || data.length === 0){

    alert(
      "Is competitive exam ke liye abhi MCQ available nahi hai."
    );

    return;
  }


  const questions =
    data.map(q => ({

      question:q.question,

      options:[
        q.option_a,
        q.option_b,
        q.option_c,
        q.option_d
      ],

      correct:
        ["A","B","C","D"]
          .indexOf(q.correct_answer),

      explanation:
        q.explanation || ""
    }));


  openTest(

    questions,

    {
      type:"Competitive",
      category,
      exam,
      language
    }

  );
}


/* ---------------- TEST ---------------- */

function openTest(questions,info){

  currentQuestions = questions;

  currentAnswers =
    new Array(questions.length).fill(null);

  currentQuestionIndex = 0;

  testInfo = info;

  document.getElementById("mainSection")
    .classList.add("hidden");

  document.getElementById("resultSection")
    .classList.add("hidden");

  document.getElementById("testSection")
    .classList.remove("hidden");

  document.getElementById("testTitle")
    .innerText =
      info.type + " MCQ Test";

  renderQuestion();
}


function renderQuestion(){

  if(!currentQuestions.length) return;

  const q =
    currentQuestions[currentQuestionIndex];

  document.getElementById("progress")
    .innerText =
      "Question " +
      (currentQuestionIndex + 1) +
      " / " +
      currentQuestions.length;


  let html = "";

  html +=
    `<div class="question">
      <strong>${escapeHTML(q.question)}</strong>
    </div>`;


  q.options.forEach((option,index)=>{

    const selected =
      currentAnswers[currentQuestionIndex] === index
        ? "selected"
        : "";

    html += `
      <button
        class="option ${selected}"
        onclick="selectAnswer(${index})">
        ${String.fromCharCode(65+index)}. 
        ${escapeHTML(option)}
      </button>
    `;
  });


  document.getElementById("questionBox")
    .innerHTML = html;
}


function selectAnswer(index){

  currentAnswers[currentQuestionIndex] =
    index;

  renderQuestion();
}


function previousQuestion(){

  if(currentQuestionIndex > 0){

    currentQuestionIndex--;

    renderQuestion();
  }
}


function nextQuestion(){

  if(
    currentAnswers[currentQuestionIndex] === null
  ){

    alert("Pehle answer select karo.");

    return;
  }


  if(
    currentQuestionIndex <
    currentQuestions.length - 1
  ){

    currentQuestionIndex++;

    renderQuestion();

  }else{

    alert(
      "Ye last question hai. Test submit kar sakte ho."
    );
  }
}


async function submitTest(){

  const unanswered =
    currentAnswers.filter(
      a => a === null
    ).length;


  if(unanswered > 0){

    const confirmSubmit =
      confirm(
        unanswered +
        " questions unanswered hain.\n\n" +
        "Kya test submit karna hai?"
      );

    if(!confirmSubmit) return;
  }


  let correct = 0;

  currentQuestions.forEach((q,index)=>{

    if(
      currentAnswers[index] === q.correct
    ){

      correct++;
    }
  });


  const total =
    currentQuestions.length;

  const wrong =
    total - correct;

  const percentage =
    Math.round(
      (correct / total) * 100
    );


  lastResult = {

    total,
    correct,
    wrong,
    percentage,
    answers:[...currentAnswers],
    questions:[...currentQuestions],
    info:{...testInfo}
  };


  saveHistory(lastResult);


  document.getElementById("testSection")
    .classList.add("hidden");

  document.getElementById("resultSection")
    .classList.remove("hidden");


  document.getElementById("resultBox")
    .innerHTML = `

      <div>📊 Total Questions: <b>${total}</b></div>

      <div>✅ Correct: <b>${correct}</b></div>

      <div>❌ Wrong: <b>${wrong}</b></div>

      <div>📈 Percentage: <b>${percentage}%</b></div>

    `;


  document.getElementById("reviewBox")
    .innerHTML = "";
}


/* ---------------- REVIEW ---------------- */

function showReview(){

  if(!lastResult) return;


  let html =
    "<h2>📖 Answer Review</h2>";


  lastResult.questions.forEach(
    (q,index)=>{

      const user =
        lastResult.answers[index];

      const correct =
        q.correct;


      let status =
        user === correct
          ? "correct"
          : "wrong";


      html += `
        <div class="review-item">

          <p>
            <b>${index+1}. 
            ${escapeHTML(q.question)}</b>
          </p>

          <p>
            Your Answer:
            ${
              user === null
                ? "Not Answered"
                : escapeHTML(q.options[user])
            }
          </p>

          <p>
            Correct Answer:
            ${escapeHTML(q.options[correct])}
          </p>

          <p>
            ${
              status === "correct"
                ? "✅ Correct"
                : "❌ Wrong"
            }
          </p>

          ${
            q.explanation
              ? `<p>💡 ${escapeHTML(q.explanation)}</p>`
              : ""
          }

        </div>
      `;
    }
  );


  document.getElementById("reviewBox")
    .innerHTML = html;
}


/* ---------------- HISTORY ---------------- */

function saveHistory(result){

  const history =
    JSON.parse(
      localStorage.getItem(
        "mcq_master_history"
      ) || "[]"
    );


  history.unshift({

    date:new Date().toLocaleString(),

    type:result.info.type,

    title:
      result.info.type === "Education"
        ? `${result.info.className} - ${result.info.subject}`
        : `${result.info.category} - ${result.info.exam}`,

    score:
      `${result.correct}/${result.total}`,

    percentage:
      result.percentage
  });


  localStorage.setItem(
    "mcq_master_history",
    JSON.stringify(
      history.slice(0,50)
    )
  );
}


function loadHistory(){

  const box =
    document.getElementById("history");


  const history =
    JSON.parse(
      localStorage.getItem(
        "mcq_master_history"
      ) || "[]"
    );


  if(history.length === 0){

    box.innerHTML =
      "<p>No test history yet.</p>";

    return;
  }


  box.innerHTML =
    history.map(h => `

      <div class="review-item">

        <b>${escapeHTML(h.title)}</b>

        <br>

        ${h.type}

        <br>

        Score:
        ${h.score}

        <br>

        Percentage:
        ${h.percentage}%

        <br>

        <span class="small">
          ${escapeHTML(h.date)}
        </span>

      </div>

    `).join("");
}


/* ---------------- HELPERS ---------------- */

function showLoading(show){

  if(show){

    document.getElementById("loading")
      .classList.remove("hidden");

  }else{

    document.getElementById("loading")
      .classList.add("hidden");
  }
}


function escapeHTML(value){

  if(value === null ||
     value === undefined){

    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function backToMain(){

  document.getElementById("resultSection")
    .classList.add("hidden");

  document.getElementById("mainSection")
    .classList.remove("hidden");

  loadHistory();
}


/* ---------------- START ---------------- */

checkSession();
