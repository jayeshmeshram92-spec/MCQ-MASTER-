<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MCQ MASTER - Student Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#07152e;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:#102750;
  border:1px solid #3974c7;
  border-radius:22px;
  padding:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin-bottom:5px;
}

.tagline{
  text-align:center;
  color:#a9c9f5;
  margin-bottom:25px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #4d78ad;
  background:#081a38;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.loginBtn{
  background:#2f80ed;
  color:white;
}

.signupBtn{
  background:#20a464;
  color:white;
}

.forgotBtn{
  background:#263b61;
  color:white;
}

.switch{
  text-align:center;
  margin-top:20px;
  color:#a9c9f5;
}

.link{
  color:#58a6ff;
  font-weight:bold;
  cursor:pointer;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  display:none;
  background:#193b6b;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#8fc4ff;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">📚🧠 MCQ MASTER</div>

  <div class="tagline">
    All India Education & Competitive Exam Platform
  </div>

  <!-- LOGIN -->
  <div id="loginSection">

    <h2>🔐 Student Login</h2>

    <input
      id="loginEmail"
      type="email"
      placeholder="Email Address"
      autocomplete="email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="loginBtn" onclick="studentLogin()">
      🔐 Login
    </button>

    <button class="forgotBtn" onclick="forgotPassword()">
      🔑 Forgot Password
    </button>

    <div class="switch">
      New Student?
      <span class="link" onclick="showSignup()">
        Create Account
      </span>
    </div>

  </div>


  <!-- SIGNUP -->
  <div id="signupSection" style="display:none;">

    <h2>📝 Create Student Account</h2>

    <input
      id="signupName"
      type="text"
      placeholder="Full Name"
      autocomplete="name"
    >

    <input
      id="signupEmail"
      type="email"
      placeholder="Email Address"
      autocomplete="email"
    >

    <input
      id="signupPassword"
      type="password"
      placeholder="Create Password"
      autocomplete="new-password"
    >

    <button class="signupBtn" onclick="studentSignup()">
      📝 Create Account
    </button>

    <div class="switch">
      Already have an account?
      <span class="link" onclick="showLogin()">
        Login
      </span>
    </div>

  </div>


  <div id="message" class="message"></div>

  <a class="back" href="index.html">
    ← Back to MCQ MASTER
  </a>

</div>


<script>

const SUPABASE_URL =
"https://sssuikjzkurnwntthflx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pmLD97XYDiVBTxu5Ouedtw_r4uL4is9";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// -------------------------
// MESSAGE
// -------------------------

function showMessage(text){

  const box = document.getElementById("message");

  box.innerText = text;
  box.style.display = "block";
}


// -------------------------
// SHOW LOGIN
// -------------------------

function showLogin(){

  document.getElementById("loginSection").style.display = "block";

  document.getElementById("signupSection").style.display = "none";

  document.getElementById("message").style.display = "none";
}


// -------------------------
// SHOW SIGNUP
// -------------------------

function showSignup(){

  document.getElementById("loginSection").style.display = "none";

  document.getElementById("signupSection").style.display = "block";

  document.getElementById("message").style.display = "none";
}


// -------------------------
// LOGIN
// -------------------------

async function studentLogin(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    showMessage("⚠️ Email aur password enter karo.");

    return;
  }

  showMessage("⏳ Login ho raha hai...");

  const { data, error } =
    await db.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(error){

    showMessage("❌ " + error.message);

    return;
  }


  if(data.session){

    showMessage("✅ Login successful! MCQ MASTER open ho raha hai...");

    setTimeout(function(){

      window.location.href = "index.html";

    },700);

  }

}


// -------------------------
// SIGNUP
// -------------------------

async function studentSignup(){

  const name =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;


  if(!name || !email || !password){

    showMessage("⚠️ Name, email aur password tino bharo.");

    return;
  }


  if(password.length < 6){

    showMessage("⚠️ Password kam se kam 6 characters ka hona chahiye.");

    return;
  }


  showMessage("⏳ Account create ho raha hai...");


  const { data, error } =
    await db.auth.signUp({

      email:email,

      password:password,

      options:{
        data:{
          full_name:name
        }
      }

    });


  if(error){

    showMessage("❌ " + error.message);

    return;
  }


  if(data.session){

    showMessage("✅ Account created! MCQ MASTER open ho raha hai...");

    setTimeout(function(){

      window.location.href = "index.html";

    },700);

  }else{

    showMessage(
      "✅ Account created! Email verify karo, phir Login karo."
    );

  }

}


// -------------------------
// FORGOT PASSWORD
// -------------------------

async function forgotPassword(){

  const email =
    document.getElementById("loginEmail").value.trim();


  if(!email){

    showMessage("⚠️ Pehle apna email enter karo.");

    return;
  }


  const { error } =
    await db.auth.resetPasswordForEmail(

      email,

      {
        redirectTo:
        window.location.origin +
        window.location.pathname
      }

    );


  if(error){

    showMessage("❌ " + error.message);

  }else{

    showMessage(
      "✅ Password reset link email par bhej diya gaya hai."
    );

  }

}


// -------------------------
// IF ALREADY LOGGED IN
// -------------------------

async function checkExistingLogin(){

  const { data } =
    await db.auth.getSession();

  if(data.session){

    window.location.href = "index.html";

  }

}

checkExistingLogin();

</script>

</body>
</html>
