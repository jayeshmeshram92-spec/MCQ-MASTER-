<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152e">
<title>MCQ MASTER — Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07152e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{width:min(460px,100%);margin:auto;padding:20px}.logo{text-align:center;font-size:34px;font-weight:900;margin:35px 0 8px}.tag{text-align:center;color:#a9c9f5;margin-bottom:24px}
.card{background:#102750;border:1px solid #3974c7;border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
h2{text-align:center;margin:0 0 18px}label{display:block;color:#b9d5f7;margin:12px 0 6px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #4774aa;background:#081a38;color:#fff;font-size:16px;outline:none}
button{width:100%;padding:14px;margin-top:13px;border:0;border-radius:10px;background:#2f80ed;color:#fff;font-size:16px;font-weight:800;touch-action:manipulation}
.secondary{background:#315f9f}.link{background:transparent;color:#9fc8f4;font-weight:600}.msg{text-align:center;line-height:1.5;margin-top:12px;color:#b9d5f7}.error{color:#ff8a92}.success{color:#55df9a}
.small{text-align:center;color:#7595bd;font-size:13px;margin-top:22px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">📚🧠 MCQ MASTER</div>
  <div class="tag">Education • Practice • Competitive Exams</div>
  <div class="card">
    <h2 id="title">Student Login</h2>
    <div id="nameWrap" class="hidden"><label>Full Name</label><input id="name" autocomplete="name" placeholder="Your full name"></div>
    <label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    <label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Minimum 6 characters">
    <button id="mainBtn" onclick="submitAuth()">🔐 Login</button>
    <button class="link" onclick="forgotPassword()">Forgot password?</button>
    <button class="secondary" onclick="toggleMode()">Create new account</button>
    <div id="msg" class="msg"></div>
  </div>
  <div class="small">Your account is protected by Supabase Authentication.</div>
</div>
<script>
const SUPABASE_URL="https://sssuikjzkurnwntthflx.supabase.co";
const SUPABASE_KEY="sb_publishable_pmLD97XYDiVBTxu5Ouedtw_r4uL4is9";
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
let signup=false;
const $=id=>document.getElementById(id);
function msg(t,kind=""){ $("msg").className="msg "+kind; $("msg").innerText=t; }
function toggleMode(){
  signup=!signup;
  $("title").innerText=signup?"Create Student Account":"Student Login";
  $("nameWrap").classList.toggle("hidden",!signup);
  $("mainBtn").innerText=signup?"📝 Create Account":"🔐 Login";
  document.querySelector(".secondary").innerText=signup?"Already have an account? Login":"Create new account";
  msg("");
}
async function submitAuth(){
  if(!db){msg("Supabase load nahi hua. Internet check karo.","error");return}
  const email=$("email").value.trim(),password=$("password").value;
  if(!email||!password){msg("Email aur password enter karo.","error");return}
  $("mainBtn").disabled=true;
  try{
    if(signup){
      const name=$("name").value.trim();
      if(!name){msg("Full Name enter karo.","error");return}
      if(password.length<6){msg("Password kam se kam 6 characters ka hona chahiye.","error");return}
      const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name}}});
      if(error) throw error;
      if(data.session){window.location.replace("index.html");return}
      msg("Account create ho gaya. Agar email confirmation enabled hai to email verify karke login karo.","success");
      toggleMode();
    }else{
      const {error}=await db.auth.signInWithPassword({email,password});
      if(error) throw error;
      window.location.replace("index.html");
    }
  }catch(e){msg(e.message||"Authentication failed.","error")}
  finally{$("mainBtn").disabled=false}
}
async function forgotPassword(){
  if(!db)return;
  const email=$("email").value.trim();
  if(!email){msg("Pehle email enter karo.","error");return}
  try{
    const redirect=location.href.replace(/[^/]*$/,"login.html");
    const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:redirect});
    if(error)throw error;
    msg("Password reset email bhej diya gaya hai.","success");
  }catch(e){msg(e.message||"Reset request failed.","error")}
}
if(db){
  db.auth.getSession().then(({data})=>{if(data.session)window.location.replace("index.html")});
}
</script>
</body>
</html>
