<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MCQ MASTER - Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a;
}
header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
}
header h1{margin:0;font-size:25px}
header p{margin:6px 0 0;color:#cbd5e1}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  font-size:21px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:16px;
  background:white;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}

.primary{
  background:#16a34a;
  color:white;
}

.secondary{
  background:#2563eb;
  color:white;
}

.danger{
  background:#dc2626;
  color:white;
}

.gray{
  background:#64748b;
  color:white;
}

#adminArea{display:none}

.status{
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  display:none;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.questionItem{
  border:1px solid #dbe2ea;
  border-radius:12px;
  padding:15px;
  margin-top:12px;
}

.questionItem strong{
  display:block;
  margin-bottom:8px;
}

.actions button{
  margin-right:6px;
}

@media(max-width:650px){
  .row{grid-template-columns:1fr}
  .container{padding:12px}
  .card{padding:16px}
}
</style>
</head>

<body>

<header>
  <h1>📝 MCQ MASTER</h1>
  <p>Admin Question Panel</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div class="card" id="loginBox">
    <h2>🔐 Admin Login</h2>

    <div id="loginStatus" class="status"></div>

    <label>Email</label>
    <input id="adminEmail" type="email" placeholder="Admin email">

    <label>Password</label>
    <input id="adminPassword" type="password" placeholder="Password">

    <button class="primary" onclick="adminLogin()">Login</button>
  </div>


  <!-- ADMIN -->
  <div id="adminArea">

    <div class="card">
      <h2>👤 Admin</h2>
      <p id="adminUser"></p>
      <button class="danger" onclick="logout()">Logout</button>
    </div>


    <!-- ADD QUESTION -->
    <div class="card">

      <h2>➕ Add MCQ Question</h2>

      <div id="saveStatus" class="status"></div>

      <label>Question Type</label>
      <select id="questionType">
        <option value="education">Education</option>
        <option value="competitive">Competitive Exam</option>
      </select>

      <label>Question Language</label>
      <select id="language">
        <option value="English">English</option>
        <option value="Hindi">Hindi</option>
        <option value="Marathi">Marathi</option>
        <option value="Bengali">Bengali</option>
        <option value="Gujarati">Gujarati</option>
        <option value="Tamil">Tamil</option>
        <option value="Telugu">Telugu</option>
        <option value="Kannada">Kannada</option>
        <option value="Malayalam">Malayalam</option>
        <option value="Punjabi">Punjabi</option>
        <option value="Urdu">Urdu</option>
      </select>


      <div class="row">

        <div>
          <label>State</label>
          <input id="state" placeholder="Example: Maharashtra">
        </div>

        <div>
          <label>Board</label>
          <input id="board" placeholder="Example: MSBSHSE">
        </div>

      </div>


      <div class="row">

        <div>
          <label>Class</label>
          <input id="className" placeholder="Example: 10">
        </div>

        <div>
          <label>Subject</label>
          <input id="subject" placeholder="Example: Science">
        </div>

      </div>


      <label>Chapter / Topic</label>
      <input id="chapter" placeholder="Example: Chapter 1">


      <label>Competitive Category</label>
      <input id="examCategory" placeholder="Example: Army">


      <label>Exam</label>
      <input id="examName" placeholder="Example: GD">


      <label>Question</label>
      <textarea id="question" placeholder="Enter MCQ question"></textarea>


      <label>Option A</label>
      <input id="optionA" placeholder="Option A">


      <label>Option B</label>
      <input id="optionB" placeholder="Option B">


      <label>Option C</label>
      <input id="optionC" placeholder="Option C">


      <label>Option D</label>
      <input id="optionD" placeholder="Option D">


      <label>Correct Answer</label>
      <select id="correctAnswer">
        <option value="">Select Correct Answer</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
      </select>


      <label>Explanation</label>
      <textarea id="explanation" placeholder="Explain the correct answer (optional)"></textarea>


      <button class="primary" onclick="saveQuestion()">
        💾 Save Question
      </button>

      <button class="gray" onclick="clearForm()">
        Clear
      </button>

    </div>


    <!-- QUESTION LIST -->
    <div class="card">

      <h2>📋 Question Bank</h2>

      <button class="secondary" onclick="loadQuestions()">
        🔄 Refresh Questions
      </button>

      <div id="questionList">
        <p>No questions loaded.</p>
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://sssuikjzkurnwntthflx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pmLD97XYDiVBTxu5Ouedtw_r4uL4is9";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/*
 IMPORTANT:
 Change this email if your admin email is different.
*/
const ADMIN_EMAIL = "jayeshmeshram92@gmail.com";


function showStatus(id,message,type){

  const box=document.getElementById(id);

  box.style.display="block";
  box.className="status "+type;
  box.textContent=message;

}


async function checkAdmin(){

  const {data,error}=await db.auth.getSession();

  if(error || !data.session){

    document.getElementById("loginBox").style.display="block";
    document.getElementById("adminArea").style.display="none";

    return;
  }

  const email=data.session.user.email;

  if(email !== ADMIN_EMAIL){

    document.getElementById("loginBox").style.display="block";
    document.getElementById("adminArea").style.display="none";

    showStatus(
      "loginStatus",
      "This account is not authorized as admin.",
      "error"
    );

    return;
  }

  document.getElementById("loginBox").style.display="none";
  document.getElementById("adminArea").style.display="block";

  document.getElementById("adminUser").textContent =
    "Logged in as: "+email;

  loadQuestions();
}


async function adminLogin(){

  const email=document.getElementById("adminEmail").value.trim();
  const password=document.getElementById("adminPassword").value;

  if(!email || !password){

    showStatus(
      "loginStatus",
      "Please enter email and password.",
      "error"
    );

    return;
  }

  const {data,error}=await db.auth.signInWithPassword({
    email:email,
    password:password
  });

  if(error){

    showStatus(
      "loginStatus",
      error.message,
      "error"
    );

    return;
  }

  if(data.user.email !== ADMIN_EMAIL){

    await db.auth.signOut();

    showStatus(
      "loginStatus",
      "This account is not an admin account.",
      "error"
    );

    return;
  }

  checkAdmin();
}


async function logout(){

  await db.auth.signOut();

  location.reload();
}


async function saveQuestion(){

  const question =
    document.getElementById("question").value.trim();

  const optionA =
    document.getElementById("optionA").value.trim();

  const optionB =
    document.getElementById("optionB").value.trim();

  const optionC =
    document.getElementById("optionC").value.trim();

  const optionD =
    document.getElementById("optionD").value.trim();

  const correct =
    document.getElementById("correctAnswer").value;

  if(!question ||
     !optionA ||
     !optionB ||
     !optionC ||
     !optionD ||
     !correct){

    showStatus(
      "saveStatus",
      "Please fill Question, all 4 Options and Correct Answer.",
      "error"
    );

    return;
  }


  const questionData={

    question_type:
      document.getElementById("questionType").value,

    language:
      document.getElementById("language").value,

    state:
      document.getElementById("state").value.trim(),

    board:
      document.getElementById("board").value.trim(),

    class_name:
      document.getElementById("className").value.trim(),

    subject:
      document.getElementById("subject").value.trim(),

    chapter:
      document.getElementById("chapter").value.trim(),

    exam_category:
      document.getElementById("examCategory").value.trim(),

    exam_name:
      document.getElementById("examName").value.trim(),

    question:question,

    option_a:optionA,

    option_b:optionB,

    option_c:optionC,

    option_d:optionD,

    correct_answer:correct,

    explanation:
      document.getElementById("explanation").value.trim()
  };


  const {error}=await db
    .from("questions")
    .insert(questionData);


  if(error){

    showStatus(
      "saveStatus",
      "Save failed: "+error.message,
      "error"
    );

    return;
  }


  showStatus(
    "saveStatus",
    "✅ Question saved successfully!",
    "success"
  );

  clearForm();
  loadQuestions();
}


async function loadQuestions(){

  const list=document.getElementById("questionList");

  list.innerHTML="<p>Loading...</p>";


  const {data,error}=await db
    .from("questions")
    .select("*")
    .order("created_at",{ascending:false});


  if(error){

    list.innerHTML=
      "<p style='color:red'>"+
      "Could not load questions: "+
      error.message+
      "</p>";

    return;
  }


  if(!data || data.length===0){

    list.innerHTML="<p>No questions found.</p>";

    return;
  }


  list.innerHTML="";


  data.forEach((q,index)=>{

    const item=document.createElement("div");

    item.className="questionItem";

    item.innerHTML=`

      <strong>${index+1}. ${escapeHtml(q.question)}</strong>

      <div>A. ${escapeHtml(q.option_a || "")}</div>
      <div>B. ${escapeHtml(q.option_b || "")}</div>
      <div>C. ${escapeHtml(q.option_c || "")}</div>
      <div>D. ${escapeHtml(q.option_d || "")}</div>

      <p>
        <b>Correct:</b>
        ${escapeHtml(q.correct_answer || "")}
      </p>

      <p>
        <b>Type:</b>
        ${escapeHtml(q.question_type || "")}
      </p>

      <p>
        <b>Language:</b>
        ${escapeHtml(q.language || "")}
      </p>

      <div class="actions">

        <button
          class="danger"
          onclick="deleteQuestion('${q.id}')">
          🗑️ Delete
        </button>

      </div>
    `;

    list.appendChild(item);

  });

}


async function deleteQuestion(id){

  if(!confirm("Delete this question?")) return;


  const {error}=await db
    .from("questions")
    .delete()
    .eq("id",id);


  if(error){

    alert("Delete failed: "+error.message);
    return;
  }


  alert("Question deleted.");

  loadQuestions();
}


function clearForm(){

  document.getElementById("question").value="";
  document.getElementById("optionA").value="";
  document.getElementById("optionB").value="";
  document.getElementById("optionC").value="";
  document.getElementById("optionD").value="";
  document.getElementById("correctAnswer").value="";
  document.getElementById("explanation").value="";

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


checkAdmin();

</script>

</body>
</html>
